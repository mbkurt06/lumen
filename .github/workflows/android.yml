name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths-ignore: ["**.md", "legacy/**", "supabase/**"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://nndammodckedypoqrpqa.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install
      - run: npm run build

      - name: Android projesini üret ve yamala
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CODE=$CODE" >> $GITHUB_ENV
          npx cap add android
          cp -r android-overlay/. android/
          python3 scripts/patch-android.py "$CODE" "$VERSION"
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: İmzala (anahtar tanımlıysa)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK_DIR=android/app/build/outputs/apk/release
          OUT=lumen-v${VERSION}-${CODE}.apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lumen.p12"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 "$APK_DIR/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/lumen.p12" --ks-key-alias lumen \
              --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS \
              --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "$OUT" | head -3
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 tanımlı değil; imzasız APK üretildi (kurulamaz)."
            cp "$APK_DIR/app-release-unsigned.apk" "$OUT"
            echo "signed=false" >> $GITHUB_OUTPUT
          fi
          echo "APK_NAME=$OUT" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 14

      - name: Supabase'e yükle (güncelleme deposu)
        if: steps.sign.outputs.signed == 'true'
        env:
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SRK" ]; then echo "::warning::SUPABASE_SERVICE_ROLE_KEY yok; yükleme atlandı"; exit 0; fi
          SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)
          up() { curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/app-updates/$1" \
            -H "Authorization: Bearer $SRK" -H "apikey: $SRK" -H "x-upsert: true" \
            -H "Content-Type: $2" --data-binary "@$3"; echo; }
          up "$APK_NAME" application/vnd.android.package-archive "$APK_NAME"
          printf '{"versionCode":%s,"versionName":"%s","file":"%s","sha256":"%s","builtAt":"%s","commit":"%s"}' \
            "$CODE" "$VERSION" "$APK_NAME" "$SHA" "$(date -u +%FT%TZ)" "${GITHUB_SHA::7}" > latest.json
          up latest.json application/json latest.json
