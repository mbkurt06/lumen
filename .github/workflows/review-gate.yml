name: Review gate

# Makes Codex review findings block the merge.
#
# 1. "Codex review gate" commit status on the PR head:
#      failure  -> Codex has unresolved review comments
#      success  -> Codex finished with no open findings (or never answered within 30 min)
#      pending  -> waiting for Codex
#    Add "Codex review gate" to the required checks of the main ruleset.
# 2. On agent PRs, Claude addresses Codex findings, pushes, replies and resolves the threads.
#    After 2 rounds without success the PR gets "needs-human".

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  id-token: write
  actions: read

env:
  CODEX_BOT: chatgpt-codex-connector[bot]
  MAX_REVIEW_ROUNDS: 2
  WAIT_MINUTES: 30

jobs:
  gate:
    if: |
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'codex-review-summary'))
    runs-on: ubuntu-latest
    concurrency:
      group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || 'all' }}
      cancel-in-progress: true
    steps:
      - name: Evaluate Codex findings
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const bot = process.env.CODEX_BOT;
            const waitMs = Number(process.env.WAIT_MINUTES) * 60_000;

            let numbers = [];
            const p = context.payload;
            if (p.pull_request) numbers = [p.pull_request.number];
            else if (p.issue) numbers = [p.issue.number];
            else numbers = (await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 50 })).data.map(x => x.number);

            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open') continue;

              const q = await github.graphql(`
                query($owner:String!,$repo:String!,$number:Int!){
                  repository(owner:$owner,name:$repo){
                    pullRequest(number:$number){
                      reviewThreads(first:100){ nodes{ isResolved comments(first:1){ nodes{ author{ login } } } } }
                    }
                  }
                }`, { owner, repo, number });
              const open = q.repository.pullRequest.reviewThreads.nodes.filter(t =>
                !t.isResolved && (t.comments.nodes[0]?.author?.login || '') + '[bot]' === bot
              ).length;

              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
              const summary = comments.filter(c => c.user.login === bot && c.body.includes('codex-review-summary')).pop();
              let finished = false;
              if (summary) {
                const m = summary.body.match(/codex-review-state:v1 (\{.*\}) -->/);
                try { finished = JSON.parse(m[1]).code_review.status === 'completed'; } catch {}
              }

              let state, description;
              if (open > 0) { state = 'failure'; description = `Codex: ${open} açık bulgu`; }
              else if (finished) { state = 'success'; description = 'Codex: açık bulgu yok'; }
              else if (Date.now() - new Date(pr.created_at).getTime() > waitMs) {
                state = 'success'; description = `Codex ${process.env.WAIT_MINUTES} dk içinde incelemedi`;
              } else { state = 'pending'; description = 'Codex incelemesi bekleniyor'; }

              await github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.head.sha, state, description, context: 'Codex review gate',
              });
              core.info(`#${number}: ${state} (${description})`);
            }

  fix-findings:
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'claude/') ||
       startsWith(github.event.pull_request.head.ref, 'codex/') ||
       contains(github.event.pull_request.user.login, 'jules') ||
       contains(github.event.pull_request.user.login, 'copilot'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: review-fix-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Count rounds
        id: rounds
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: number });
            const used = comments.filter(c => c.body?.includes('<!-- review-fix-round -->')).length;
            const findings = (await github.paginate(github.rest.pulls.listCommentsForReview, {
              ...context.repo, pull_number: number, review_id: context.payload.review.id,
            })).length;
            if (findings === 0) { core.setOutput('go', 'none'); return; }
            if (used >= Number(process.env.MAX_REVIEW_ROUNDS)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: ['needs-human'] });
              await github.rest.issues.createComment({ ...context.repo, issue_number: number,
                body: `Codex bulguları ${process.env.MAX_REVIEW_ROUNDS} turda kapanmadı. İnsan gerekiyor.` });
              core.setOutput('go', 'limit');
              return;
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: number,
              body: `<!-- review-fix-round -->\nCodex ${findings} bulgu bildirdi. Otomatik düzeltme turu ${used + 1}/${process.env.MAX_REVIEW_ROUNDS}.` });
            core.setOutput('go', 'yes');

      - name: Telegram - needs human
        if: steps.rounds.outputs.go == 'limit'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="$TG_CHAT" \
            --data-urlencode text="🆘 Lumen: Codex bulguları otomatik kapanmadı. $PR_URL" > /dev/null

      - uses: actions/checkout@v4
        if: steps.rounds.outputs.go == 'yes'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: steps.rounds.outputs.go == 'yes'
        with:
          node-version: 22

      - name: Claude addresses the review
        if: steps.rounds.outputs.go == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "chatgpt-codex-connector[bot],claude[bot],github-actions[bot]"
          prompt: |
            Codex reviewed PR #${{ github.event.pull_request.number }} (branch `${{ github.event.pull_request.head.ref }}`)
            and left findings in review ${{ github.event.review.id }}.
            Read them with:
              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${{ github.event.review.id }}/comments

            Follow AGENTS.md. For each finding:
            - If it is correct, fix it with the smallest change.
            - If you disagree, do not change code; reply on that comment with a short, concrete reason.
            Then run `npm install` and `npm run build`, commit and push to `${{ github.event.pull_request.head.ref }}`.
            Reply to each finding comment saying what you did:
              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/COMMENT_ID/replies -f body="..."
            Resolve only the threads you actually fixed (find thread ids with `gh api graphql` on
            pullRequest.reviewThreads, then call the resolveReviewThread mutation).
            Leave threads you disagreed with unresolved so a human decides.
            Finally comment `@codex review` on the PR to ask for a fresh review.
            Never edit tests/e2e/, .github/ or supabase/migrations/.
          claude_args: |
            --max-turns 60
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm install),Bash(npm ci),Bash(npm run build),Bash(npx tsc:*),Bash(gh api:*),Bash(gh pr comment:*)"
